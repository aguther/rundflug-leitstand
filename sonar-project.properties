sonar.projectKey=aguther_rundflug-leitstand
sonar.organization=aguther
sonar.projectName=rundflug-leitstand
sonar.projectVersion=1.12.0
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# D1 migrations use SQLite. Keep .sql files out of the Oracle PL/SQL analyzer;
# Sonar's SQL dialect detector can still identify and inspect SQLite sources.
sonar.plsql.file.suffixes=.plsql,.pkb,.pks

sonar.sources=apps,packages,scripts
sonar.tests=apps,packages,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.worker-spec.ts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.worker-spec.ts,**/dist/**,**/.wrangler/**,apps/web/public/**/*.png
sonar.coverage.exclusions=scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Individually reviewed scanner false positives. Each criterion is limited to one
# exact rule and source file; see the dated triage record.
sonar.issue.ignore.multicriteria=backupRestore
sonar.issue.ignore.multicriteria.backupRestore.ruleKey=pythonsecurity:S3649
sonar.issue.ignore.multicriteria.backupRestore.resourceKey=scripts/verify_backup_restore.py
