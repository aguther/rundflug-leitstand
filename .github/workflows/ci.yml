name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 12.0.2
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm" npm@12.0.2
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check:ci
