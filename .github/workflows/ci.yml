name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  LANG: C.UTF-8
  TZ: UTC
  NPM_CONFIG_FETCH_RETRIES: "3"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"

jobs:
  check:
    name: Quality and coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Test coverage
        run: npm run test:coverage
      - name: CI check
        run: npm run check:ci
      - name: SonarQube branch scan
        if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
        run: >-
          npm run sonar:scan --
          -Dsonar.branch.name=${{ github.ref_name }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload LCOV report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  worker-runtime:
    name: Worker runtime
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
      - name: Build web assets
        run: npm run build:web
      - name: Test Worker runtime
        run: npm run test:worker-runtime

  forecast-comparison-baseline:
    name: Forecast comparison baseline
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
      - name: Test forecast comparison baseline
        run: npm run test:forecast-comparison-baseline

  v1-integration:
    name: V1 integration shard ${{ matrix.shard }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
      - name: Build web assets
        run: npm run build:web
      - name: Test V1 integrations serially inside the shard
        env:
          V1_INTEGRATION_REPORT: reports/v1-integration/shard-${{ matrix.shard }}.json
        run: npm run test:v1-integrations -- --shard=${{ matrix.shard }}/4
      - name: Upload V1 integration report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v1-integration-${{ matrix.shard }}
          path: reports/v1-integration/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  backup-restore:
    name: Backup and restore
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
        with:
          python: "true"
      - name: Test backup restore
        run: npm run backup:restore:test

  documentation:
    name: Documentation
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
        with:
          python: "true"
      - name: Install role guide verification dependency
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Verify documentation
        run: npm run docs:verify
      - name: Verify requirements
        run: npm run requirements:verify

  mutation:
    name: Critical domain mutation tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
      - name: Run mutation tests
        run: npm run test:mutation
      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-reports
          path: reports/mutation
          if-no-files-found: error
          retention-days: 30

  sonar-pull-request:
    name: SonarQube pull request quality gate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Test coverage
        run: npm run test:coverage
      - name: SonarQube pull request scan
        run: >-
          npm run sonar:scan --
          -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
          -Dsonar.pullrequest.branch=${{ github.head_ref }}
          -Dsonar.pullrequest.base=${{ github.base_ref }}
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-cloudflare:
    name: Deploy verified main revision
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_AUTOMATIC_DEPLOYMENT_ENABLED == 'true'
    needs:
      - check
      - worker-runtime
      - forecast-comparison-baseline
      - v1-integration
      - backup-restore
      - documentation
      - mutation
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      target: rundflug-leitstand
    secrets: inherit
