name: Cloudflare-Performance-SLO

on:
  workflow_dispatch:
    inputs:
      target:
        description: Geschützte GitHub-Environment der Abnahmeumgebung
        required: true
        type: string
      target_origin:
        description: HTTPS-Origin des Cloudflare-Abnahme-Workers
        required: true
        type: string
      event_id:
        description: Dedizierte synthetische Veranstaltung mit Präfix perf-
        required: true
        type: string
      sample_rounds:
        description: Messrunden mit jeweils 20 parallelen Abrufen
        required: true
        default: 3
        type: number
      confirmation:
        description: Für die read-only SLO-Messung exakt PERFORMANCE eingeben
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-performance-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  measure:
    if: inputs.confirmation == 'PERFORMANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 12.0.2
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm" npm@12.0.2
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:cloudflare-scale-performance
        env:
          CLOUDFLARE_SCALE_TARGET_ORIGIN: ${{ inputs.target_origin }}
          CLOUDFLARE_SCALE_EVENT_ID: ${{ inputs.event_id }}
          CLOUDFLARE_SCALE_SAMPLE_ROUNDS: ${{ inputs.sample_rounds }}
          CLOUDFLARE_SCALE_CONFIRMATION: ${{ inputs.confirmation }}
