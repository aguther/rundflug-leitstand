name: Cloudflare deployment

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Protected GitHub environment to deploy
        required: true
        type: string
      confirmation:
        description: Enter DEPLOY for a manual deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      CI: "true"
      LANG: C.UTF-8
      TZ: UTC
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      DEPLOYMENT_BACKUP_TOKEN: ${{ secrets.DEPLOYMENT_BACKUP_TOKEN }}
      CLOUDFLARE_TARGET: ${{ inputs.target }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_NAME: ${{ vars.CLOUDFLARE_D1_NAME }}
      CLOUDFLARE_R2_NAME: ${{ vars.CLOUDFLARE_R2_NAME }}
      CLOUDFLARE_APP_ENV: ${{ vars.CLOUDFLARE_APP_ENV }}
      CLOUDFLARE_DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-project
      - name: Generate immutable target configuration
        run: npm run cloudflare:ci-config
      - name: Build deployment artifacts
        run: npm run build
      - name: Verify existing resources and long-lived secrets before any remote change
        env:
          PREFLIGHT_ALLOW_MISSING_DEPLOYMENT_SECRET: "true"
        run: npm run cloudflare:preflight -- --target "$CLOUDFLARE_TARGET"
      - name: Backup, migrate and deploy
        run: npm run cloudflare:deploy -- --target "$CLOUDFLARE_TARGET"
      - name: Verify deployed revision and resources
        run: npm run cloudflare:verify -- --target "$CLOUDFLARE_TARGET" --url "$CLOUDFLARE_DEPLOYMENT_URL"
