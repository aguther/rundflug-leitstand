name: Cloudflare-Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Zielname wie verein-abnahme oder verein-produktion
        required: true
        type: string
      apply_migrations:
        description: Ausstehende additive D1-Migrationen vor dem Deployment anwenden
        required: true
        default: false
        type: boolean
      confirmation:
        description: Für das Deployment exakt DEPLOY eingeben
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_TARGET: ${{ inputs.target }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_NAME: ${{ vars.CLOUDFLARE_D1_NAME }}
      CLOUDFLARE_R2_NAME: ${{ vars.CLOUDFLARE_R2_NAME }}
      CLOUDFLARE_APP_ENV: ${{ vars.CLOUDFLARE_APP_ENV }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - id: config
        run: echo "path=$(npm run --silent cloudflare:ci-config)" >> "$GITHUB_OUTPUT"
      - run: npx wrangler d1 migrations list DB --remote --config "${{ steps.config.outputs.path }}"
      - if: inputs.apply_migrations
        run: npx wrangler d1 migrations apply DB --remote --config "${{ steps.config.outputs.path }}"
      - if: inputs.apply_migrations == false
        run: |
          if ! npx wrangler d1 migrations list DB --remote --config "${{ steps.config.outputs.path }}" | grep -qi "No migrations to apply"; then
            echo "Es sind Migrationen offen. Erneut mit apply_migrations starten." >&2
            exit 1
          fi
      - run: npm run build:web
      - run: npx wrangler deploy --config "${{ steps.config.outputs.path }}"
