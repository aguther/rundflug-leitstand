name: Cloudflare-Maintenance

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-maintenance-rundflug-leitstand
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    environment: rundflug-leitstand
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_TARGET: rundflug-leitstand
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_D1_NAME: ${{ vars.CLOUDFLARE_D1_NAME }}
      CLOUDFLARE_R2_NAME: ${{ vars.CLOUDFLARE_R2_NAME }}
      CLOUDFLARE_APP_ENV: ${{ vars.CLOUDFLARE_APP_ENV }}
      CLOUDFLARE_DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm 12.0.2
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm" npm@12.0.2
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Verify compatibility date, toolchain, observability and bindings
        run: npm run cloudflare:maintenance -- --enforce-compatibility-age
      - name: Verify Worker runtime and log privacy
        run: |
          npm run test:worker-runtime
          npx vitest run apps/worker/src/worker-log-privacy.test.ts
      - id: config
        run: echo "path=$(npm run --silent cloudflare:ci-config)" >> "$GITHUB_OUTPUT"
      - name: Verify deployed health, metadata, revision and remote resources
        run: npm run cloudflare:verify -- --target rundflug-leitstand --url "$CLOUDFLARE_DEPLOYMENT_URL"
