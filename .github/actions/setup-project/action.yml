name: Setup project runtime
description: Install the pinned Node.js, npm and optional Python toolchain
inputs:
  python:
    description: Install Python 3.13
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install npm 12.0.2
      shell: bash
      run: |
        npm install --global --prefix "$RUNNER_TEMP/npm" npm@12.0.2
        echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
    - if: inputs.python == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.13"
    - name: Install dependencies
      shell: bash
      run: npm ci
